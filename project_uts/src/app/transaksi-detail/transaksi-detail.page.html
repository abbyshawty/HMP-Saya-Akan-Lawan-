<!-- transaksi-detail/transaksi-detail.page.html -->
<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/transaksi"></ion-back-button>
    </ion-buttons>
    <ion-title>Detail Transaksi</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ng-container *ngIf="transaksi; else tidakAda">
    <ion-list lines="full">
      <ion-item>
        <ion-label>
          <h2>Transaksi #{{ transaksi.id }}</h2>
          <p>{{ transaksi.tanggal | date:'dd MMMM yyyy, HH:mm' }}</p>
        </ion-label>
      </ion-item>

      <ion-item *ngFor="let i of transaksi.items">
        <ion-label>
          <h3>{{ i.nama }}</h3>
          <p>{{ i.qty }} x {{ rp(i.harga) }}</p>
        </ion-label>
        <ion-note slot="end">{{ rp(i.qty * i.harga) }}</ion-note>
      </ion-item>

      <ion-item>
        <ion-label><strong>Total</strong></ion-label>
        <ion-note slot="end"><strong>{{ rp(transaksi.total) }}</strong></ion-note>
      </ion-item>
    </ion-list>
  </ng-container>

  <ng-template #tidakAda>
    <div class="ion-text-center ion-padding">
      <h2>Transaksi tidak ditemukan</h2>
      <ion-button routerLink="/transaksi" routerDirection="back">Kembali ke riwayat</ion-button>
    </div>
  </ng-template>
</ion-content>
